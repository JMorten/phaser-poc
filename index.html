<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0e11">
<link rel="icon" href="data:,">
<title>A Última Lua — POC Action RPG</title>
<style>
  html,body{margin:0;height:100%;background:#07090d;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0;touch-action:none}
  #app{width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));color:#e8e2d2;font:13px/1.35 "Trebuchet MS",Georgia,system-ui;z-index:5;pointer-events:none;text-shadow:0 1px 3px #000;max-width:min(78vw,420px)}
  #hud .panel{background:linear-gradient(180deg,rgba(18,14,12,.82),rgba(8,8,10,.78));border:1px solid rgba(170,140,90,.45);border-radius:8px;padding:8px 10px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35)}
  #hp{color:#ffd7d7;font-weight:700;letter-spacing:.2px}
  #ehp{color:#d8d0bf;margin-top:2px}
  #souls{color:#b9d7ff;margin-top:2px}
  #dodgeBar{width:132px;height:8px;background:rgba(20,24,30,.9);border:1px solid rgba(120,150,180,.35);border-radius:5px;margin-top:6px;overflow:hidden}
  #dodgeFill{height:100%;background:linear-gradient(90deg,#3f7ea8,#7fd0ff);border-radius:4px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><div class="panel"><div id="hp"></div><div id="ehp"></div><div id="souls"></div><div id="dodgeBar"><div id="dodgeFill"></div></div></div></div>
<script src="vendor/phaser.min.js"></script>
<script src="src/main.js"></script>
</body>
</html>
